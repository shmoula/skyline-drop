<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Skyline Drop</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      /* No page pan or pinch-zoom in the letterbox; taps on the bar still click. */
      body { touch-action: none; }
      canvas#game { position: absolute; image-rendering: pixelated; touch-action: none; }
      #error { position: absolute; inset: 0; margin: auto; height: fit-content; max-width: 32em;
               padding: 1em; color: #fff; background: #a00; font: 14px/1.4 monospace; white-space: pre-wrap; }
      #error button { font: inherit; padding: 0.4em 0.8em; }
      #bar { position: fixed; left: 0; right: 0; bottom: 0; box-sizing: border-box; min-height: 48px;
             padding: 6px 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center;
             background: #111; border-top: 1px solid #333; color: #fff; font: 13px/1.2 monospace; }
      #bar[hidden] { display: none; }
      #bar button, #bar input { font: inherit; color: #fff; background: #222; border: 1px solid #666;
                                border-radius: 3px; padding: 0 10px; height: 34px; box-sizing: border-box; }
      #bar button:not(:disabled) { cursor: pointer; }
      #bar button:disabled { opacity: 0.4; }
      #bar input { width: 12ch; text-transform: uppercase; }
      #bar .swatch { padding: 3px; width: 34px; }
      #bar .swatch canvas { display: block; width: 24px; height: 24px; image-rendering: pixelated; }
      #bar .swatch[aria-pressed="true"] { border-color: #fd0; box-shadow: 0 0 0 1px #fd0; }
    </style>
  </head>
  <body>
    <canvas id="game" width="320" height="200"></canvas>
    <div id="bar" hidden></div>
    <div id="error" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
